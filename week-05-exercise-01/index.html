<!doctype html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

    <main>

            <section>
                <h2>Button Style 03</h2>
                <button type="button" class="button-03">Shadow Lift</button>
            </section>
            <section>
                <h2>Button Style 04</h2>
                <button type="button" class="button-04">Slide Right</button>
            </section>
            <section>
                <h2>Button Style 05</h2>
                <button type="button" class="button-05">Soft Corners</button>
            </section>
            <section>
                <h2>Button Style 06</h2>
                <button type="button" class="button-06">Spring Press</button>
